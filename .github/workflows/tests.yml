name: tests

on:
  push:
    branches: [main, "corrections/**"]
  pull_request:
    branches: [main, "corrections/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Validate plugin manifests
        run: |
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python -c "import json; json.load(open('plugins/hr/.claude-plugin/plugin.json'))"
          test -f plugins/hr/commands/dossier.md
      - name: Byte-compile helper scripts
        run: python -m compileall -q scripts
